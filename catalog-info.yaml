# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dockerfile-hardener
  description: >-
      Static analyser that rewrites Dockerfiles to follow security best practices: pinned digests, non-
      root user, minimal base, no secrets.
  annotations:
    github.com/project-slug: fabiocicerchia/dockerfile-hardener
    backstage.io/source-location: url:https://github.com/fabiocicerchia/dockerfile-hardener/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/dockerfile-hardener
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
