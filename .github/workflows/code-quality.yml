name: code-quality

# Complements ci.yml (which runs ruff + pytest + build): this lints the repo
# itself — workflows, editorconfig, typos — and runs the pre-commit hooks.
# ponytail: actions are tag-pinned; dependabot (github-actions) keeps them
# fresh — SHA-pin to match ci.yml if scorecard flags it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4  # v2

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@3bc303c295c081add5df4a4d52a1e117f2fb2dce  # master

      # pre-commit runs the hooks in .pre-commit-config.yaml (ruff, gitleaks, …).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
