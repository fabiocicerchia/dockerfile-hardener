name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # FC-PY-003. Runs here rather than in pre-commit because a type checker
      # with no dependencies installed reports every import as unresolved and
      # every value that came through one as unknown -- noise that says nothing
      # about this code.
      - name: Basedpyright
        run: basedpyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # hadofix's engine. The golden cases replay stored JSON so the suite runs
      # without it, but the end-to-end test skips silently when it is missing —
      # and a skipped test proves nothing. Pinned by version and checksum,
      # matching the hook in .pre-commit-config.yaml.
      - name: Install hadolint
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
      - name: Install package with dev dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-release.txt
          python -m build
      - name: Check metadata
        run: twine check dist/*  # installed from the hashed lock above
