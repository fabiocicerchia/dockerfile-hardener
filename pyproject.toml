[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfile-hardener"
version = "0.2.1"
description = "Rewrites Dockerfiles to best practice as a suggested diff, not lint warnings"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.4", "build>=1.5.0", "basedpyright>=1.31"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/dockerfile-hardener"
Issues = "https://github.com/fabiocicerchia/dockerfile-hardener/issues"
Changelog = "https://github.com/fabiocicerchia/dockerfile-hardener/blob/main/CHANGELOG.md"

[project.scripts]
dockerfile-hardener = "dockerfile_hardener:main"

[tool.setuptools]
py-modules = ["dockerfile_hardener"]

[tool.pytest.ini_options]
# Without this the suite imports dockerfile_hardener from site-packages (pytest
# does not add the rootdir to sys.path), so `make test` can pass green against
# an installed wheel while the checkout is broken.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.interrogate]
fail-under = 60
exclude = ["build", "dist", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]

[tool.basedpyright]
# FC-PY-003 asks for strict. The point of a type checker in CI is that it knows
# the types: "unknown" is the finding, not a level of detail to relax away.
typeCheckingMode = "strict"
# Matches requires-python, so the checker rejects what the oldest supported
# interpreter would reject rather than what this machine happens to run.
pythonVersion = "3.10"
# Third-party stubs are not this repository's to ship, and a missing one is a
# packaging fact about someone else's project rather than a defect here.
reportMissingTypeStubs = false
