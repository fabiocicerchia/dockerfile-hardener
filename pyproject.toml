[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfile-hardener"
version = "0.2.1"
description = "Rewrites Dockerfiles to best practice as a suggested diff, not lint warnings"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.4", "build>=1.5.0"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/dockerfile-hardener"
Issues = "https://github.com/fabiocicerchia/dockerfile-hardener/issues"
Changelog = "https://github.com/fabiocicerchia/dockerfile-hardener/blob/main/CHANGELOG.md"

[project.scripts]
dockerfile-hardener = "dockerfile_hardener:main"

[tool.setuptools]
py-modules = ["dockerfile_hardener"]

[tool.ruff]
line-length = 100

[tool.interrogate]
fail-under = 60
exclude = ["build", "dist", "tests"]
