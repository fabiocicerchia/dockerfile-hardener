[default]
# release-please writes CHANGELOG entries as markdown links whose label is the
# abbreviated commit SHA — "([703ba65](https://github.com/.../commit/703ba65…))".
# typos splits such a hash into words, so "ba" in it is reported as "by"/"be".
# Ignore SHA-shaped labels and commit URLs, so CHANGELOG.md prose is still checked.
extend-ignore-re = ["/commit/[0-9a-f]{7,40}", "\\[[0-9a-f]{7,40}\\]"]
