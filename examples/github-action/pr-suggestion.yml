name: hadofix suggestions

# Drop this in a consuming repo's .github/workflows/ to get a PR comment with a
# ready-to-apply suggestion whenever hadolint finds something hadofix can fix.

on:
  pull_request:
    paths:
      - "**/Dockerfile*"

permissions:
  contents: read
  pull-requests: write

env:
  # hadofix's engine. Pinned by version and checksum: a tag can be moved.
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
      - run: pip install hadofix
      - name: Comment a suggestion per changed Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '**/Dockerfile*')
          for f in $changed; do
            [ -f "$f" ] || continue
            # The diff is stdout and the report is stderr, so they split cleanly.
            hadofix "$f" > /tmp/diff.txt 2> /tmp/report.txt || true
            [ -s /tmp/diff.txt ] || continue
            hadofix "$f" --write > /dev/null 2>&1 || true
            {
              echo "### hadofix suggestion for \`$f\`"
              echo
              echo '```suggestion'
              cat "$f"
              echo '```'
              echo
              echo "<details><summary>what hadolint found, and what was left for you</summary>"
              echo
              echo '```text'
              cat /tmp/report.txt
              echo '```'
              echo "</details>"
            } > /tmp/body.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/body.md
          done
